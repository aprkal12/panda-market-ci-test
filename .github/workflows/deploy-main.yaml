name: Deploy to AWS EC2
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: EC2 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          port: 2222 # sk broadband 22번 포트 차단 이슈 -> ec2도 ssh 2222로 세팅 변경
          script: |
            set -e
            set +x

            PROJECT_PATH="/home/${{ secrets.AWS_USERNAME }}/panda-market"

            if [ ! -d "$PROJECT_PATH" ]; then
              git clone https://github.com/${{ github.repository }} $PROJECT_PATH
            fi

            cd $PROJECT_PATH
            git pull origin main
            cd panda-market

            printf "%s" "${{ secrets.ENV_FILE }}" > .env

            echo "👉 Installing dependencies..."
            npm ci --silent --no-progress 2>npm_err.log || {
              echo "❌ npm ci 실패:"
              tail -n 20 npm_err.log
              exit 1
            }

            echo "👉 Building..."
            npm run build --silent 2>build_err.log || {
              echo "❌ build 실패:"
              tail -n 20 build_err.log
              exit 1
            }

            echo "👉 Restarting server..."
            pm2 reload panda-market || pm2 start dist/app.js --name "panda-market"

            echo "🎉 배포 성공!"
