name: Deploy to AWS EC2
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: EC2 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          port: 2222 # sk broadband 22번 포트 차단 이슈 -> ec2도 ssh 2222로 세팅 변경
          envs: ENV_FILE
          script: |
            # 에러 나면 즉시 멈추되, 로그는 최대한 자세히 찍도록 설정
            set -e

            echo "🚀 배포 스크립트 시작!"

            # 0. 환경변수 로드 (수정됨: 파일이 없어도 죽지 않도록 || true 추가)
            echo "👉 환경변수 로드 시도..."
            [ -f ~/.zshrc ] && source ~/.zshrc || true
            [ -f ~/.bash_profile ] && source ~/.bash_profile || true
            [ -f ~/.bashrc ] && source ~/.bashrc || true

            # 1. 경로 변수 설정
            PROJECT_PATH="/home/${{ secrets.AWS_USERNAME }}/panda-market"
            echo "👉 [Step 1] 배포 경로: $PROJECT_PATH"

            # 2. 폴더 체크 및 클론/풀
            if [ ! -d "$PROJECT_PATH" ]; then
              echo "📂 폴더가 없습니다. 토큰을 사용하여 복제(Clone)합니다..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} $PROJECT_PATH
              cd $PROJECT_PATH
            else
              echo "📂 폴더가 존재합니다. 토큰을 사용하여 업데이트(Pull)합니다..."
              cd $PROJECT_PATH
              git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} main
            fi

            # 3. .env 생성
            echo "👉 [Step 2] .env 생성 중..."
            cd panda-market
            echo "$ENV_FILE" > .env

            # 4. 의존성 설치 (로그 자세히 보기 위해 --silent 제거)
            echo "👉 [Step 3] 의존성 설치 (npm ci)..."
            npm ci

            # 5. 빌드
            echo "👉 [Step 4] 빌드 시작..."
            npm run build

            # 6. 서버 재시작
            echo "👉 [Step 5] 서버 재시작 (PM2)..."
            pm2 reload panda-market || pm2 start dist/app.js --name "panda-market"

            echo "🎉 배포 성공!"
